server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pedido}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pedido}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pedido}
spring.jpa.hibernate.ddl-auto=update
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
